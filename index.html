<!DOCTYPE html>
<html>
  <head>
    <title>AR.js Basic - Uji Coba</title>
    <!-- Memanggil mesin 3D A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- Memanggil mesin pelacak AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <!-- Memulai scene AR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Menentukan pemicu (Marker Hiro) -->
      <a-marker preset="hiro">
        
        <!-- Objek 3D yang akan muncul (Kubus merah berputar) -->
        <a-box 
          position="0 0.5 0" 
          color="red" 
          animation="property: rotation; to: 0 360 0; loop: true; dur: 2000">
        </a-box>

      </a-marker>
      
      <!-- Menambahkan kamera agar layar HP menampilkan tangkapan dunia nyata -->
      <a-entity camera></a-entity>
      
    </a-scene>
    
  </body>
</html>
