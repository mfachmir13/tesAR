<!DOCTYPE html>
<html>
  <head>
    <title>WebAR - Animasi Video</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- 1. Deklarasi Aset Video -->
      <a-assets>
        <!-- UBAH BAGIAN INI: ganti "animasi.mp4" dengan nama file videomu di GitHub -->
        <video 
          id="ar-video" 
          src="download.mp4" 
          loop="true" 
          crossorigin="anonymous" 
          playsinline 
          webkit-playsinline 
          autoplay 
          muted>
        </video>
      </a-assets>

      <!-- 2. Pemicu Marker Hiro -->
      <a-marker preset="hiro">
        
        <!-- 3. Bidang tempat video muncul -->
        <!-- Kamu bisa ubah width dan height jika ukuran videonya persegi panjang (misal width="2" height="1.5") -->
        <a-plane 
          src="#ar-video" 
          position="0 0 0" 
          rotation="-90 0 0" 
          width="2" 
          height="2">
        </a-plane>

      </a-marker>
      
      <a-entity camera></a-entity>
      
    </a-scene>

    <!-- Script pemicu agar video otomatis play saat layar HP ditotol/diklik -->
    <script>
      window.addEventListener('click', function () {
        var v = document.querySelector('#ar-video');
        if (v) {
          v.play();
        }
      });
    </script>
    
  </body>
</html>
